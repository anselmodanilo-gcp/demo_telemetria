version: '3.8'

services:
  telemetry-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gcp_telemetria_simulator
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SIMULATION_INTERVAL_SECONDS=4.0
      - VEHICLE_COUNT=10
      - SIMULATION_SPEED_MULTIPLIER=1.0
      - TRANSMISSION_MODE=http
      - TARGET_SERVER_URL=http://127.0.0.1:8000/api/v1/telemetry
      - BATCH_TARGET_SERVER_URL=http://127.0.0.1:8000/api/v1/telemetry/batch
      - WEBSOCKET_URL=ws://127.0.0.1:8000/ws/telemetry
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8000
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
